[package]
name = "lis-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
lis-core = { version = "0.1.0", path = "../core" }
lis-video = { version = "0.1.0", path = "../video" }
mdns-sd = "0.21.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal", "process"] }

[dev-dependencies]
lis-ffi = { path = "../ffi" }
tempfile = "3.27.0"
