[package]
name = "lis-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lis-core = { version = "0.1.0", path = "../core" }
lis-video = { version = "0.1.0", path = "../video" }
mdns-sd = "0.21.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
lis-ffi = { path = "../ffi" }
lis-relay = { path = "../relay" }
ring = "0.17.14"
tempfile = "3.27.0"
