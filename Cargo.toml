[workspace]
members = ["video", "core", "daemon", "ffi", "relay", "obs-plugin"]
# The plugin needs OBS's headers, so it's only built when asked for: cargo build -p lis-camera
default-members = ["video", "core", "daemon", "ffi", "relay"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
