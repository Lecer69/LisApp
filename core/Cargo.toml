[package]
name = "lis-core"
version.workspace = true
edition.workspace = true

[dependencies]
hex = "0.4.3"
lis-video = { version = "0.1.0", path = "../video" }
rand = "0.10.3"
ring = "0.17.14"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3.27.0"
