[package]
name = "lis-ffi"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
hex = "0.4.3"
lis-core = { version = "0.1.0", path = "../core" }
lis-video = { version = "0.1.0", path = "../video" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
uniffi = { version = "0.32.2", features = ["cli"] }

[dev-dependencies]
tempfile = "3.27.0"
